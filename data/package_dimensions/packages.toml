# Curated package registry. Land patterns are ALWAYS the referenced KiCad 10
# library footprint (used verbatim on the cards). Nominal body values below are
# what is printed on the cards.
#
# body = [length along pin rows / long side D, width E1] in mm (nominal)
# span = lead tip-to-tip E (mm, nominal) where applicable
# status:
#   VERIFIED       primary manufacturer / standard document read during development
#   CROSS-CHECKED  nominal value from the cited standard family; automatically
#                  compared with the KiCad library F.Fab body (tests/test_data.py)
#   UNVERIFIED     not yet checked: must not be relied on
# A family name never implies a universal size: the variant is given explicitly.

[chip]   # [EIA code, metric code, KiCad footprint, P70 (W), body L, body W]
note = "Nominal body L x W (mm) per common EIA/IEC chip sizes; the metric code is a ROUNDED name (2012 = 2.0 x 1.25). Real parts vary by vendor (typ. +/-0.05..0.2 mm). Land pattern: KiCad R_* footprint, IPC-7351 nominal density."
body_status = "CROSS-CHECKED"   # automatically compared with KiCad F.Fab bodies (tests/test_data.py)
codes = [
  ["01005", "0402", "Resistor_SMD:R_01005_0402Metric", "1/32", 0.4, 0.2],
  ["0201", "0603", "Resistor_SMD:R_0201_0603Metric", "1/20", 0.6, 0.3],
  ["0402", "1005", "Resistor_SMD:R_0402_1005Metric", "1/16", 1.0, 0.5],
  ["0603", "1608", "Resistor_SMD:R_0603_1608Metric", "1/10", 1.6, 0.8],
  ["0805", "2012", "Resistor_SMD:R_0805_2012Metric", "1/8", 2.0, 1.25],
  ["1206", "3216", "Resistor_SMD:R_1206_3216Metric", "1/4", 3.2, 1.6],
  ["1210", "3225", "Resistor_SMD:R_1210_3225Metric", "1/2", 3.2, 2.5],
  ["1812", "4532", "Resistor_SMD:R_1812_4532Metric", "-", 4.5, 3.2],
  ["2010", "5025", "Resistor_SMD:R_2010_5025Metric", "3/4", 5.0, 2.5],
  ["2512", "6332", "Resistor_SMD:R_2512_6332Metric", "1", 6.3, 3.2],
]
power_source = "Yageo RC_L thick-film datasheet V.5 (Feb 2017), rated power at 70 degC; read via alldatasheet mirror (yageo.com PDF 404 on 2026-10-19). 01005 = RC0100. Yageo has no 1812 (uses 1218)."
power_status = "UNVERIFIED"   # secondary copy only; re-check against current Yageo PDF

